#The maximum number of navigation chunks allowed
max_nav_chunks = 66049
#The maximum number of layers per chunk
max_layers = 37
#Require creative mode to use navigation item operations (add/remove navigation). Set to false to allow usage in any game mode.
require_creative_mode = false
#Execute pathfinding on server side. When true, nav data sync is disabled and pathfinding results are sent to clients.
server_side_pathfinding = true
#The default distance of block when parse nav chunk
defaultBlockDistance = 10
#The maximum concurrent chunk solving tasks in a batch building progress
max_concurrent_tasks = 4
#The block distance for each block.
block_distance = ["minecraft:dirt_path:3"]
