#Delay in ticks before a dropped item can be picked up by ether stream
# Default: 20
# Range: 0 ~ 100
item_pick_up_by_stream_delay_after_dropped = 20

[ether]
	#How many ether value to gain from one ether item
	# Default: 100
	# Range: > 1
	convert = 100
	#Ticks an ether item entity must wait before auto-converting to inactivated ether
	# Default: 100
	# Range: > 1
	inactivate_convert_tick = 100

[node]
	#Default max ether value of Ether Adapt Node
	# Default: 6400
	# Range: > 1
	default_max_ether = 6400
	#Number of upgrade slots per level
	upgrade_slots = [2, 4, 6]

	[node.furnace]
		#Divisor applied to item burn time (higher = faster fuel consumption)
		# Default: 4
		# Range: 1 ~ 100
		burn_time_factor = 4
		#Ether generated per tick while furnace is actively burning fuel
		# Default: 25
		# Range: > 1
		ether_per_tick = 25
		#Ether generated per tick while blast furnace is actively burning fuel
		# Default: 30
		# Range: > 1
		ether_per_tick_blast_furnace = 30
		#Divisor applied to item burn time (higher = faster fuel consumption)
		# Default: 4
		# Range: 1 ~ 100
		burn_time_factor_blast_furnace = 4

	[node.magnet]
		#Ether consumed by magnet function when picking up one stack of items
		# Default: 100
		# Range: > 1
		ether_per_stack = 100

	[node.container_interact]
		#Ether consumed per item transferred by ContainerInteract feature
		# Default: 10
		# Range: > 1
		ether_per_item = 10
		#Cooldown ticks between ContainerInteract transfers (20 ticks = 1 second)
		# Default: 2
		# Range: > 1
		cd = 10

	[node.dropper_thrower]
		#Ether consumed per item thrown by DropperThrower feature
		# Default: 10
		# Range: > 1
		ether_per_item = 10

	[node.process]
		#Max progress ticks for Node Process function to complete one recipe
		# Default: 100
		# Range: > 1
		max_progress = 100
		#The ether consumed per tick before the node process upgrade is matched
		# Default: 1
		# Range: > 0
		ether_consume_pre_unmatched = 1

	[node.ether_converter]
		#Ether generated per item consumed by the Ether Converter function plugin
		# Default: 1000
		# Range: > 1
		coefficient = 100

	[node.equipment_generator]
		#Burn tick provided by each equipment in Equipment Generator plugin
		# Default: 100
		# Range: > 1
		burn_tick = 100
		#Coefficient for ether generation from equipment consumption in Equipment Generator plugin
		# Default: 100
		# Range: 1 ~ 10000
		coefficient = 250
		#Base amount of ether generated by Equipment Generator plugin
		# Default: 10
		# Range: > 1
		base_amount = 25

	[node.growth_accelerator]
		#Ether consumed per crop block accelerated by GrowthAccelerator function plugin
		# Default: 500
		# Range: > 1
		ether_cost = 500
		#Manhattan distance range for GrowthAccelerator to scan for eligible crop blocks
		# Default: 1
		# Range: 1 ~ 16
		range = 1

		[node.emitter.min_ether]
			#Minimum bound for the emitter minimum ether slider
			# Default: 0
			# Range: > 0
			min = 0
			#Maximum bound for the emitter minimum ether slider
			# Default: 100000
			# Range: > 0
			max = 100000

	[node.enchanter]
		#Ether cost for Enchanter plugin levels 1, 2, and 3
		ether_costs = [6000, 12000, 24000]
		#Max progress ticks for Enchanter plugin to complete enchanting (20 ticks = 1 second)
		# Default: 20
		# Range: > 1
		max_progress = 100

	[node.upgrade]
		#The multipiler each ether storage upgrade plugin will provide
		# Default: 2.5
		# Range: 1.0 ~ 200.0
		ether_storage_multipiler = 2.5

	[node.auto_supply]
		#Ether level below which the auto supply upgrade activates and starts providing ether
		# Default: 1000
		# Range: > 0
		threshold = 1000
		#Ether provided per tick by a single auto supply upgrade
		# Default: 5
		# Range: > 1
		ether_per_tick = 5

	[node.mute]
		#Maximum range per axis for mute plugin (slider upper bound)
		# Default: 16
		# Range: 1 ~ 256
		max_range = 16
		#Ether consumed per 16 blocks of mute volume per tick
		# Default: 5
		# Range: > 0
		ether_per_16_block = 5

[ether_stream]
	#Maximum lifetime of an Ether Stream entity in ticks (20 ticks = 1 second)
	# Default: 1200
	# Range: > 1
	max_tick = 1200
	#The chance when glass will be transformed when ether stream passes
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	glass_transform_chance = 0.5
	#Base ether consumption per tick as a fraction of total ether stored in the stream
	# Default: 0.005
	# Range: 0.0 ~ 10.0
	consumption_factor = 0.005
	#Additional ether consumption factor added per tick of the stream's lifetime (accumulates over time)
	# Default: 1.0E-4
	# Range: 0.0 ~ 10.0
	consumption_factor_by_time = 1.0E-4
	#...
	# Default: 20
	# Range: > 0
	ether_glass_prevent_consume = 20
	#When more than this many same-source ether streams are in one block, destroy the first one
	# Default: 100
	# Range: > 1
	destroy_threshold = 100
	#Maximum distance in blocks from an emitter to sync ether stream packets to nearby players. Set to -1 to sync to the entire dimension.
	# Default: 128.0
	# Range: -1.0 ~ 512.0
	sync_distance = 128.0
	#Ticks between counter decrements in index mapping
	# Default: 20
	# Range: > 1
	index_mapping_decay_interval = 20
	#Records needed before a stream gets a stable index
	# Default: 20
	# Range: > 1
	index_mapping_register_threshold = 20
	#Ticks between refreshing the block collision snapshot along an ether stream (1 = every tick)
	# Default: 1
	# Range: > 1
	block_scan_interval = 10

	[ether_stream.break_block]
		#Multiplier for block hardness in ether cost calculation per block break
		# Default: 20
		# Range: > 1
		hardness_multiplier = 20
		#Ether cost reduction per level of Efficiency enchantment when breaking blocks
		# Default: 3
		# Range: > 0
		efficiency_divisor = 3
		#Flat ether cost added to every block break on top of the hardness-based formula
		# Default: 0
		# Range: > 0
		constant_cost = 0

	[ether_stream.damage]
		#Ether consumed per point of damage dealt by Ether Stream
		# Default: 5
		# Range: > 1
		ether_multiplier = 5
		#Flat ether cost added to every damage instance on top of the damage-based formula
		# Default: 0
		# Range: > 0
		constant_cost = 0

	[ether_stream.growth_accelerator]
		#Ether consumed per crop block accelerated by Ether Stream Growth Accelerator capability
		# Default: 1000
		# Range: > 1
		ether_cost = 1000

	[ether_stream.label]
		#Maximum size of label rendered on Ether Stream
		# Default: 10.0
		# Range: 1.0 ~ 1000000.0
		max_size = 10.0

	[ether_stream.display_time]
		#Ticks the precomputed DisplayTime collision end point stays cached before rescanning
		# Default: 20
		# Range: > 1
		cache_tick = 20

[plating]
	#Duration in ticks for plating to complete (20 ticks = 1 second)
	# Default: 100
	# Range: 1 ~ 12000
	duration_ticks = 100
	#Max amount to receive from one ether stream
	# Default: 6400
	# Range: > 1
	max_ether_receive = 6400

	[plating.dash]
		#Cooldown ticks for Dash plating effect
		# Default: 20
		# Range: 0 ~ 12000
		cd_ticks = 20
		#Ether cost for Dash plating effect
		# Default: 500
		# Range: > 0
		ether_cost = 500

	[plating.high_jump]
		#Cooldown ticks for High Jump plating effect
		# Default: 20
		# Range: 0 ~ 12000
		cd_ticks = 20
		#Ether cost for High Jump plating effect
		# Default: 1000
		# Range: > 0
		ether_cost = 1000

	[plating.soul]
		#Ether consumed per tick by Soul Projection plating effect
		# Default: 1
		# Range: > 0
		ether_per_tick = 1
		#Maximum range in blocks for Soul Projection camera
		# Default: 64
		# Range: 1 ~ 512
		max_range = 64

	[plating.no_gravity]
		#Ether cost per arrow for No Gravity plating effect
		# Default: 125
		# Range: > 0
		ether_per_arrow = 125

	[plating.coyote_time]
		#Ether cost per delayed jump for Coyote Time plating effect
		# Default: 5
		# Range: > 0
		ether_per_jump = 5

	[plating.camouflage]
		#Ticks the player must stand still before Camouflage plating activates (20 ticks = 1 second)
		# Default: 100
		# Range: 1 ~ 12000
		stand_duration = 100
		#Ether consumed by Camouflage
		# Default: 500
		# Range: > 0
		ether_per_tick = 500
		#The max speed that allows user to enter camouflage status.
		# Default: 0.05
		# Range: 0.0 ~ 20.0
		speed_threshold = 0.05
		#The ether gain in camouflage status
		# Default: 2
		# Range: > 0
		gain_per_tick = 2

	[plating.block]
		#Fraction of frontal damage reduced while blocking (0~1)
		# Default: 0.5
		# Range: 0.0 ~ 1.0
		damage_reduction = 0.5
		#Ether consumed per tick while blocking
		# Default: 500
		# Range: > 0
		ether_per_tick = 500

	[plating.crit]
		#Ether consumed per attack by Crit plating
		# Default: 75
		# Range: > 0
		ether_per_attack = 75

	[plating.crit_damage]
		#Ether consumed per attack by Crit Damage plating
		# Default: 75
		# Range: > 0
		ether_per_attack = 75

	[plating.head_hunt]
		#Ether consumed per kill by Head Hunt plating
		# Default: 5
		# Range: > 0
		ether_per_kill = 5

	[plating.tracking]
		#Ether consumed per arrow by Tracking plating
		# Default: 125
		# Range: > 0
		ether_per_arrow = 125
		#Search radius in blocks for arrow tracking
		# Default: 16.0
		# Range: 0.0 ~ 32.0
		range = 16.0
		#If true, arrows will not track players
		ignore_player = true

	[plating.break_to_inv]
		#Ether consumed per block broken by Break to Inventory plating
		# Default: 125
		# Range: > 0
		ether_per_block = 125

	[plating.kill_to_inv]
		#Ether consumed per kill by Kill to Inventory plating
		# Default: 125
		# Range: > 0
		ether_per_kill = 125

	[plating.stone_absorb]
		#Ether gained per stone-type block broken by Stone Absorb plating
		# Default: 125
		# Range: > 0
		ether_per_block = 125

	[plating.ether_stream_dash]
		#Cooldown ticks for Ether Stream Dash plating effect
		# Default: 5
		# Range: 0 ~ 12000
		cd_ticks = 5
		#Ether cost for Ether Stream Dash plating effect
		# Default: 500
		# Range: > 0
		ether_cost = 500
		#Speed multiplier for Ether Stream Dash
		# Default: 0.25
		# Range: 0.1 ~ 10.0
		speed = 0.25
		#The ether contains in ether stream
		# Default: 2000
		# Range: > 1
		ether_contain_faster = 2000

	[plating.ether_stream_damage]
		#Cooldown ticks for Ether Stream Damage plating effect
		# Default: 2
		# Range: 0 ~ 12000
		cd_ticks = 2
		#Ether cost for Ether Stream Damage plating effect
		# Default: 50
		# Range: > 0
		ether_cost = 50
		#Speed multiplier for Ether Stream Damage
		# Default: 1.0
		# Range: 0.01 ~ 10.0
		speed = 1.0

	[plating.ether_stream_break]
		#Cooldown ticks for Ether Stream Break plating effect
		# Default: 5
		# Range: 0 ~ 12000
		cd_ticks = 5
		#Ether cost for Ether Stream Break plating effect
		# Default: 500
		# Range: > 0
		ether_cost = 500
		#Speed multiplier for Ether Stream Break
		# Default: 1.0
		# Range: 0.01 ~ 10.0
		speed = 1.0

	[plating.anti_darkness]
		#Ether consumed when blocking Darkness or Blindness effect
		# Default: 500
		# Range: > 0
		ether_per_block = 500
		#Ether consumed per tick for Night Vision
		# Default: 1
		# Range: > 0
		ether_per_tick = 1

	[plating.ethic]
		#Ether consumed per ethical action
		# Default: 500
		# Range: > 0
		ether_per_use = 500
		#Cd of ethical action
		# Default: 20
		# Range: > 0
		cd = 20
		#If true, mute the sound effect when Ethic plating triggers
		mute_sound = true

	[plating.anti_sonic_boom]
		#Ether consumed when blocking sonic boom damage
		# Default: 5000
		# Range: > 0
		ether_per_block = 5000

	[plating.silent_step]
		#Ether consumed per tick when suppressing vibration events
		# Default: 1
		# Range: > 0
		ether_per_tick = 1

	[plating.durability_absorption]
		#Ether consumed per durability point absorbed. Minimum 1.
		# Default: 500
		# Range: > 1
		ether_per_durability = 500

[factory]
	#Low-ether fixed ratio a for chip maintain cost: base = e*a when e<=consume
	# Default: 0.17
	# Range: 0.0 ~ 1.0
	base_ratio = 0.17
	#Reserve multiplier k for batch charging: each chip receives +k*consume per batch
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	reserve_multiplier = 1.0
	#Peak overshoot of base cost curve (peak height = consume*a*(1+overshoot))
	# Default: 1.1
	# Range: 0.0 ~ 10.0
	overshoot = 1.1
	#Peak position ratio: peak of base cost at ratio * consume
	# Default: 4.7
	# Range: 1.01 ~ 100.0
	peak_ratio = 4.7
	#Decay lambda controlling falloff speed after the peak
	# Default: 1.5
	# Range: 0.01 ~ 20.0
	decay_lambda = 1.5
